{% extends "base.html" %}
{% from "_macros.html" import home_body %}

{% block title %}Tickets · symphony{% endblock %}

{% block scripts %}<script src="/static/home.js" defer></script>{% endblock %}

{% block content %}
<header class="bar">
  <a class="wordmark" href="/">symphony</a>
  <p class="conn" id="conn" role="status" hidden>Connection lost. Retrying…</p>
</header>
<main class="home" id="home-body" data-api="/api/home" data-version="{{ page.version }}">
  {{ home_body(page) }}
</main>
<nav class="dock" aria-label="Main">
  <a class="btn btn--primary" href="/new"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>New ticket</a>
  <div class="dock-links">
    <a class="dock-link" href="/" aria-current="page">Tickets</a>
    <a class="dock-link" href="/archive">Archive</a>
  </div>
</nav>
{% endblock %}
